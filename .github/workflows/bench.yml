name: cpu-bench
on: workflow_dispatch
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install numpy
      - run: python3 bench.py | tee bench.json
      - uses: actions/upload-artifact@v4
        with: {name: bench, path: bench.json}
